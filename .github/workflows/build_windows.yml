
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --name ManchesterEncoding manchester_encoding.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ManchesterEncoding_Windows
          path: dist/ManchesterEncoding.exe
